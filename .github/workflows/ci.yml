name: ci

on:
  push:
  pull_request:
  schedule:
    # Mondays 06:17 UTC: re-download the catalogued filings from their issuers and fail
    # if the bytes moved (see docs/real-filing-tests.md).
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,console]"
      - name: Offline test suite (no provider calls, no credentials)
        run: pytest -q
      - name: Capability smoke from a clean state
        env:
          FINRAIL_STATE: ${{ runner.temp }}/state
          FINRAIL_HOME: ${{ runner.temp }}/home
        run: |
          finrail capabilities | grep -q "finance.screen.run"
          finrail get finance.compute.metric metric=margin | grep -q "0.159751"

  real-filings:
    # The checker against slices of the issuers' own bytes (tests/filings/), offline.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Real-filing tests (committed slices, no network)
        run: pytest -q -rxX tests/test_real_filings.py

  originals-unchanged:
    # Weekly: fetch the originals again, re-cut the slices and compare them with the
    # committed ones, compare the PDFs' bytes, and report every hash against the catalog.
    # Fails when the statements moved, a PDF changed, an issuer is unreachable, or a source
    # that matched the catalog when sliced no longer does. NVIDIA's investor site sometimes
    # answers non-browser clients with a challenge page, so those two are blocked-ok: they
    # are checked when the fetch succeeds and reported as skipped, not failed, when it does not.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-download the originals and check every hash
        run: python3 -I scripts/check_originals.py --blocked-ok NVDA-Q1-FY2027,NVDA-Q2-FY2027
