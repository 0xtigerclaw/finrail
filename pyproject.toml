[project]
name = "finrail"
version = "0.1.0"
description = "Finrail: a finance-first agent harness. The model can suggest evidence; only code can award it trust, and only a human can release a decision."
requires-python = ">=3.11"
# Runtime is pure stdlib on purpose: the system must work on a machine with nothing
# installed but Python, so `doctor` can tell you what else you need. The model
# engines are reached over HTTPS with urllib; no vendor SDK is imported.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
console = ["fastapi", "uvicorn", "python-multipart"]

[project.scripts]
finrail = "finrail.core.entrypoint:main"
finrail-console = "console.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finrail", "finrail_plugins", "console"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# What counts as a change when uv builds this project from a local path. The
# commit is the unit of deployment, so the commit is the key.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true } }]
